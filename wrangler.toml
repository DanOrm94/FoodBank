name = "foodbank"
main = "src/index.tsx"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via Cloudflare dashboard or `wrangler secret put`):
#   SESSION_SECRET  - REQUIRED. Random string (>=16 chars) used to sign session
#                     cookies. The app refuses logins if this is unset.
#   SETUP_TOKEN     - REQUIRED to use /setup. Random string. Visit
#                     /setup?token=<SETUP_TOKEN> to create/reset the admin.
#                     If unset, /setup is disabled (returns 404).
#   ADMIN_USERNAME  - Admin login name used by /setup (default: "admin").
#   ADMIN_PASSWORD  - Admin password used by /setup (>=8 chars). Set a strong
#                     value; never commit it.

[[d1_databases]]
binding = "DB"
database_name = "foodbank-db"
database_id = "cfcef906-9000-45c2-84af-90a2fd8e5bbc"
migrations_dir = "migrations"

[observability]
enabled = true
